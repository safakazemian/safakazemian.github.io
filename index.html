<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>صفا کاظمیان</title>
<style>
  :root { --bg:#f6f7f9; --ink:#1c2430; --mute:#5b6675; --line:#d5dae1; --accent:#1f5f8b; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#141a22; --ink:#e8ecf1; --mute:#9aa6b5; --line:#2a3441; --accent:#6fb1de; }
  }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; }
  body {
    background:var(--bg); color:var(--ink);
    font-family: Vazirmatn, Tahoma, "Segoe UI", sans-serif;
    display:grid; place-items:center; padding:24px; line-height:1.9;
  }
  main { width:100%; max-width:34rem; border-inline-start:4px solid var(--accent); padding-inline-start:24px; }
  h1 { font-size:clamp(1.9rem, 6vw, 2.8rem); margin:0 0 .4rem; font-weight:700; }
  p { margin:0 0 1rem; color:var(--mute); font-size:1.05rem; }
  small { color:var(--mute); border-top:1px solid var(--line); display:block; padding-top:.8rem; margin-top:1.4rem; }
</style>
</head>
<body>
<main>
  <h1>صفا کاظمیان</h1>
  <p>این سایت در حال آماده‌سازی است. به‌زودی معرفی کامل در همین صفحه قرار می‌گیرد.</p>
  <small>صفحه‌ی آزمایشی</small>
</main>
</body>
</html>
